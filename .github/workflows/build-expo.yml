name: Build Expo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-expo.yml
      - packages/react-native-shiki-engine/**
      - examples/expo-app/**
      - examples/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  pull_request:
    paths:
      - .github/workflows/build-expo.yml
      - packages/react-native-shiki-engine/**
      - examples/expo-app/**
      - examples/shared/**
      - pnpm-lock.yaml
      - pnpm-workspace.yaml

permissions:
  contents: read

concurrency:
  group: build-expo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_android:
    name: Build Expo Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          cache: true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Package
        run: pnpm --filter react-native-shiki-engine build

      - name: Prebuild Expo Android
        working-directory: examples/expo-app
        run: pnpm exec expo prebuild --platform android --no-install

      - name: Build Android App
        run: ./gradlew assembleDebug --no-daemon --stacktrace
        working-directory: examples/expo-app/android
